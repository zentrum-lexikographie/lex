name: gpt
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:ollama
    restart: unless-stopped
    environment:
      WEBUI_URL: https://zdl-gpu01.bbaw.de
      ENABLE_SIGNUP: true
      WEBUI_NAME: ZDL LLMs
      ENABLE_REALTIME_CHAT_SAVE: true
      ENABLE_OPENAI_API: false
      ENABLE_CODE_EXECUTION: false
      ENABLE_CODE_INTERPRETER: false
    volumes:
      - open-webui:/app/backend/data
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  gateway:
    image: ${CI_REGISTRY_IMAGE:-zdl}/gpt:${CI_COMMIT_SHORT_SHA:-latest}
    restart: unless-stopped
    environment:
      - "ZDL_LEX_DEBUG=1"
      - "ZDL_LEX_GPT_API_KEY=${ZDL_LEX_GPT_API_KEY}"
      - "ZDL_LEX_QUEUE_PASSWORD=${ZDL_LEX_QUEUE_PASSWORD}"
  http:
    image: caddy
    restart: unless-stopped
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy:/data
    ports:
        - '80:80'
        - '443:443'
        - '443:443/udp'
    tty: true
volumes:
  open-webui:
  ollama:
  caddy:
configs:
  caddy_config:
    content: >-
      zdl-gpu01.bbaw.de {
          tls internal
          reverse_proxy open-webui:8080 {
              header_up Host {host}
              header_up X-Real-IP {remote}
              header_up X-Forwarded-For {remote}
              header_up X-Forwarded-Proto {scheme}

              # Health checks
              health_uri /health
              health_interval 30s
              health_timeout 10s
              health_status 200

              # Timeouts
              transport http {
                  keepalive 30s
                  keepalive_idle_conns 10
              }
          }
      }
